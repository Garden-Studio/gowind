# Once a day: when Tailwind CSS has published a release this module has no tag
# for, regenerate release.go from its checksums, test it, commit and tag it.
# On a day without a release the job is one API call.
name: Follow Tailwind

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: follow-tailwind

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Look for a new release
        id: release
        run: |
          latest=$(gh api repos/tailwindlabs/tailwindcss/releases/latest --jq .tag_name)
          echo "latest=$latest"
          case "$latest" in
            v4.*) ;;
            *) echo "::notice::Tailwind $latest needs a new major module path (/v${latest:1:1})"; exit 0 ;;
          esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$latest" >/dev/null 2>&1; then
            echo "$latest is already tagged"
            exit 0
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.version
        uses: actions/checkout@v4

      - if: steps.release.outputs.version
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Regenerate, test and tag
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          go run ./internal/gen "$VERSION"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOTAILWIND_CACHE="$RUNNER_TEMP/gotailwind" go run . --help | head -1 | grep -F "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.go
          git commit -m "Run Tailwind CSS $VERSION"
          git tag "$VERSION"
          git push origin HEAD "$VERSION"
